name: Playwright Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-26.04
    steps:
    - uses: actions/checkout@v7

    - name: Setup dotnet
      uses: actions/setup-dotnet@v4  # Updated to latest stable version
      with:
        dotnet-version: 10.0.402

    - name: Build & Install
      run: dotnet build

    - name: Run tests with TRX report
      run: dotnet test --logger "trx;LogFileName=TestResults.trx" --results-directory TestResults

    # Upload TRX report
    - name: Upload TRX report
      uses: actions/upload-artifact@v7
      if: always()
      with:
        name: trx-report
        path: TestResults/TestResults.trx
        retention-days: 14
